# docker-compose.yml
# ─────────────────────────────────────────────────────────────────
# Файл описывает один сервис — локальный переводчик LibreTranslate.
# Запуск: ---> docker compose up -d
# Остановка: ---> docker compose down
# Логи: -----> docker compose logs -f
# ─────────────────────────────────────────────────────────────────
# Корневая секция: список сервисов (контейнеров), которые Compose
# будет создавать и запускать. Может содержать несколько сервисов,
# между которыми настраивается сеть и зависимости (depends_on).
# У нас сервис один — libretranslate.
# ─────────────────────────────────────────────────────────────────
services:

  # Имя сервиса. Используется внутри Compose: для DNS-имени в сети
  # между сервисами, для команд `docker compose logs libretranslate`,
  # `docker compose restart libretranslate` и т.д.
  # Имя сервиса — это НЕ имя контейнера (см. container_name ниже).
  libretranslate:

    # Образ, из которого создаётся контейнер.
    # Формат: <репозиторий>/<имя>:<тег>
    #   dvurechensky/libretranslate-offline-ru-en-zh — образ на Docker Hub
    #   latest — тег (последняя опубликованная версия)
    # Особенность этого образа: модели en↔ru и ru↔zh уже вшиты внутрь,
    # поэтому при первом запуске ничего не скачивается из интернета.
    # Можно открыть в браузере есть интерфейс.
    # Если тег не указать, Docker подставит `latest` автоматически.
    image: dvurechensky/libretranslate-offline-ru-en-zh:latest

    # Явное имя контейнера в системе Docker.
    # Без этой строки Compose сгенерирует имя вида
    # `<папка>_<сервис>_1` (например, `zsh_libretranslate_1`).
    # С этой строкой контейнер всегда называется `libretranslate`,
    # и к нему можно обращаться напрямую: `docker logs libretranslate`,
    # `docker exec libretranslate ...`, `docker stop libretranslate`.
    # ВАЖНО: имя должно быть уникальным среди всех контейнеров системы.
    container_name: libretranslate

    # Политика перезапуска.
    # unless-stopped — Docker автоматически поднимает контейнер:
    #   • при старте демона Docker (в т.ч. после перезагрузки системы);
    #   • при аварийном падении процесса внутри контейнера;
    # НО не поднимает, если контейнер был остановлен вручную
    # (`docker stop libretranslate` / `docker compose down`).
    # Это «умный» вариант: уважает твоё решение выключить сервис.
    # Альтернативы:
    #   no — не перезапускать (по умолчанию)
    #   always — перезапускать всегда, даже после ручного stop
    #   on-failure — только при ненулевом коде выхода
    #   on-failure:5 — не более 5 попыток
    restart: unless-stopped

    # Проброс портов между хостом и контейнером.
    # Формат: "<порт_на_хосте>:<порт_в_контейнере>"
    #   5000:5000 — трафик на localhost:5000 хоста уходит в контейнер
    #               на его порт 5000, где слушает LibreTranslate.
    # Можно поменять левую часть, если 5000 на хосте занят:
    #   "5001:5000" — тогда снаружи обращаться на localhost:5001,
    #                 а внутри контейнера всё тот же 5000.
    # Можно указать IP хоста, чтобы слушать только локально:
    #   "127.0.0.1:5000:5000" — снаружи (из сети) порт недоступен,
    # только на самом компьютере.
    ports:
       - '127.0.0.1:5000:5000'

    # Переменные окружения внутри контейнера.
    # Аналог флагов `-e KEY=VALUE` у `docker run`.
    # Формат списка: "KEY=VALUE" или "KEY" (тогда значение берётся
    # из окружения хоста).
    environment:

      # Адрес, на котором LibreTranslate слушает входящие соединения.
      #   0.0.0.0 — все сетевые интерфейсы контейнера (рекомендуется);
      #   127.0.0.1 — только внутри контейнера (снаружи недоступен).
      # В контейнере обязательно 0.0.0.0, иначе проброс порта
      # `-p 5000:5000` не сработает: снаружи никто не постучится.
      # Отдельный фикс: этот параметр также обходит баг с IPv6
      # (issue #899 в LibreTranslate), когда контейнер зависает на
      # `Booting...` при попытке привязаться к адресу `[::]`.
      - LT_HOST=0.0.0.0

      # Отключение требования API-ключа.
      #   false — сервер принимает запросы без ключа (наш случай);
      #   true — требует ключ в заголовке или в теле запроса.
      # Публичные инстансы LibreTranslate (например, libretranslate.com)
      # требуют ключ, чтобы ограничить нагрузку. Локальный контейнер,
      # доступный только тебе, ключ не требует — это лишнее трение.
      - LT_API_KEYS=false