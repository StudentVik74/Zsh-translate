[project]
name = "zsh-translate"
version = "0.1.0"
description = "Переводчик на русский язык прямо в терминале"
readme = "README-RU.md"
requires-python = ">=3.12"
dependencies = [
"requests",
]

[dependency-groups]
dev = [
    "pytest>=8.1.1,<9",
    "pytest-mock>=3.14.0",
    "pytest-cov>=6.0.0",
    "wemake-python-styleguide>=1.8.1",
    "flake8-pyproject>=1.2.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
"integration: тесты, требующие реальный MyMemory API (медленно, тратит квоту)",
]

[tool.flake8]
select = ["WPS", "E999"]
format = "wemake"
extend-exclude = [".venv", "venv", "tests/fixtures/"]

[project.scripts]
ru = "utils.translate:main"
